<text class="sans title" x="600" y="96" text-anchor="middle" font-size="46" font-weight="800" fill="url(#nameGrad)">Thanks for visiting!</text>
<text class="mono sub" x="600" y="136" text-anchor="middle" font-size="18" fill="#8B949E">Let's build something together  ·  abin0x.netlify.app</text>
