<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Thanks for visiting">
<title>Thanks for visiting</title>
<defs>
<clipPath id="win"><rect x="1" y="1" width="1198" height="238" rx="20"/></clipPath>
<pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.1" fill="#16203A"/></pattern>
<linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="820" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22D3EE"/><stop offset=".35" stop-color="#38BDF8"/><stop offset=".7" stop-color="#A855F7"/><stop offset="1" stop-color="#22D3EE"/><animate attributeName="x1" values="380;820;380" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="820;1260;820" dur="7s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
</defs>
<style>
.mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinBack{to{transform:rotate(-360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,26px)}}
@keyframes driftBack{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-20px)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.w1{animation:waveL 22s linear infinite}
.w2{animation:waveR 15s linear infinite}
.w3{animation:waveL 10s linear infinite}
@keyframes waveL{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
@keyframes waveR{from{transform:translateX(-1200px)}to{transform:translateX(0)}}
.star{animation:twinkle 3s ease-in-out infinite}
.title{animation:rise .8s .2s both}
.sub{animation:rise .8s .5s both}
</style>
<g clip-path="url(#win)">
<rect width="1200" height="240" fill="#05070E"/><rect width="1200" height="240" fill="url(#dots)"/>
